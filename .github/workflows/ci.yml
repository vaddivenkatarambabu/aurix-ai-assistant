name: AURIX CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "hardening/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and quality gates (Windows / Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and quality tools
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application and tests
        run: python -m compileall -q aurix tests

      - name: Run offline automated tests
        run: python -m unittest discover -s tests -v

      - name: Check code style
        run: ruff check aurix tests

      - name: Check formatter on Milestone 6 files
        run: ruff format --check aurix/main.py aurix/observability.py tests/test_observability.py

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit runtime and development dependencies
        run: pip-audit -r requirements-dev.txt
