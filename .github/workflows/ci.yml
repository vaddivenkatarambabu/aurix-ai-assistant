name: AURIX CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "hardening/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and quality gates (Windows / Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime and quality tools
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application and tests
        run: python -m compileall -q aurix tests scripts

      - name: Run offline automated tests
        run: python -m unittest discover -s tests -v

      - name: Check code style
        run: ruff check aurix tests scripts

      - name: Check formatting
        run: ruff format --check aurix tests scripts

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit runtime and development dependencies
        run: pip-audit -r requirements-dev.txt
